name: Rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to roll back to (e.g. v1)"
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Build Docker image
        run: docker build -t node-app:${{ inputs.tag }} .

      - name: Run container (simulation)
        run: docker run -d -p 3000:3000 node-app:${{ inputs.tag }}

      - name: Wait for the container to start
        run: sleep 5

      - name: Verify application is running
        run: curl --fail http://localhost:3000/health

      - name: Show running version
        run: curl -s http://localhost:3000/health

      - name: Verify container is running
        run: docker ps -a | grep node-app